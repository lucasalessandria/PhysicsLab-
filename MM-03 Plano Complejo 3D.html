    /* ── Ciclo de vida ─────────────────────────────────────────────────────── */

    init() {
        const s = this.state;

        // Expandir el far plane para evitar que el plano gigante se corte al rotar
        this._origFar = this.camera.far;
        this.camera.far = 10000;
        this.camera.updateProjectionMatrix();

        // ACES lo aplica el OutputPass leyendo renderer.toneMapping (se restaura en destroy)
        this._origTone = this.renderer.toneMapping;
        this._origExposure = this.renderer.toneMappingExposure;
        this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
        this.renderer.toneMappingExposure = 0.85;

        // Fondo: en vez de negro PURO (que al rotar/alejar deja un rectángulo negro muerto
        // "invadiendo" la imagen), un domo de cielo oscuro atmosférico — dark space con un
        // tenue resplandor de horizonte en el color del tema. Sigue siendo oscuro (mantiene
        // el mood) pero NUNCA es #000000 vacío, así el negro no invade desde ningún ángulo
        // ni zoom, sin tener que limitar la cámara. El domo se crea abajo (necesita accent).
        this._origBg = this.scene.background;
        this._origFog = this.scene.fog;
        this.scene.background = new THREE.Color(0x000000);   // respaldo detrás del domo
        this.scene.fog = null;

        // Ocultar la grilla-piso compartida: el plano complejo ES el piso ahora.
        this.grid = this.scene.children.find(o => o.isGridHelper);
        if (this.grid) { this.gridWasVisible = this.grid.visible; this.grid.visible = false; }

        // Cámara elevada mirando el piso amplio (SIZE unidades de lado), en una vista
        // oblicua dentro de la banda segura (ver límites de órbita abajo).
        this.camera.position.set(0, 60, 30);
        this.controls.target.set(0, 3, 0);

        // ── Cámara: rotación LIBRE (a pedido del usuario) + dolly amplio ──────────────
        // El plano es un piso FINITO sobre fondo negro, así que al inclinar la cámara al
        // ras aparece el horizonte con el vacío negro encima, y al mirar cenital sobre una
        // aguja de polo el terreno puede tragar la cámara. Se aceptó ese negro a cambio de
        // poder rotar sin restricciones (como en el resto de la suite): NO se acota el
        // ángulo polar. Solo se congela la altura del relieve (ver HEIGHT_EXPR) para que
        // los polos no crezcan sin cota al reducir el dominio. Límites restaurados en
        // destroy() por si otra escena dependía de ellos.
        this._origLimits = {
            minPolar: this.controls.minPolarAngle, maxPolar: this.controls.maxPolarAngle,
            minDist: this.controls.minDistance, maxDist: this.controls.maxDistance,
        };
        this.controls.minPolarAngle = 0;            // rotación vertical completa…
        this.controls.maxPolarAngle = Math.PI;      // …hasta pasar por debajo del piso
        this.controls.minDistance = 2;      // zoom in/out libre con la rueda (a pedido)…
        this.controls.maxDistance = 2500;   // …hasta muy lejos (el domo de cielo rodea todo)

        // Acento del tema activo (var CSS --acc = "R, G, B") → uniform + marcador
        const accent = new THREE.Vector3(0.0, 1.0, 0.53);
        const acc = getComputedStyle(document.documentElement).getPropertyValue('--acc').trim();
        if (acc) {
            const p = acc.split(',').map(Number);
            if (p.length === 3 && p.every(isFinite)) accent.set(p[0] / 255, p[1] / 255, p[2] / 255);
        }

        // ── Domo de cielo: llena TODO el vacío con oscuridad atmosférica ──────────────
        // Esfera gigante vista por dentro (BackSide). Gradiente vertical oscuro (más claro
        // hacia el horizonte, negro hacia el cenit/nadir) + un resplandor tenue en la banda
        // del horizonte con el color del tema. Se mueve con la cámara, así que mires donde
        // mires nunca hay #000000 muerto — el negro deja de "invadir". depthWrite:false para
        // no ocluir nada; su tamaño lo mantiene siempre detrás del piso.
        this.sky = new THREE.Mesh(
            new THREE.SphereGeometry(4000, 32, 16),
            new THREE.ShaderMaterial({
                side: THREE.BackSide, depthWrite: false, fog: false,
                uniforms: { uAccent: { value: accent } },
                vertexShader: `
                    varying vec3 vDir;
                    void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
                fragmentShader: `
                    precision highp float;
                    varying vec3 vDir;
                    uniform vec3 uAccent;
                    void main() {
                        float y = normalize(vDir).y;                 // -1 nadir · 0 horizonte · 1 cenit
                        // base MUY oscura: apenas viva cerca del horizonte, casi negra arriba/abajo
                        vec3 base = mix(vec3(0.006, 0.013, 0.010), vec3(0.0015, 0.004, 0.003), abs(y));
                        // resplandor gaussiano tenue en la banda del horizonte, con el acento del tema
                        float glow = exp(-pow(y * 7.0, 2.0));
                        vec3 col = base + uAccent * glow * 0.028;
                        gl_FragColor = vec4(col, 1.0);
                    }`,
            })
        );
        this.sky.frustumCulled = false;
        this.scene.add(this.sky);

        this.uniforms = {
            uT:           { value: s.t },
            uHalf:        { value: s.half },
            uHeightScale: { value: s.heightScale },
            uLogHeight:   { value: s.logHeight ? 1 : 0 },
            uShowMod:     { value: s.showMod ? 1 : 0 },
            uShowPhase:   { value: s.showPhase ? 1 : 0 },
            uShowGrid:    { value: s.showGrid ? 1 : 0 },
            uGlow:        { value: s.glow },
            uAccent:      { value: accent },
            uZetaTerms:   { value: s.zetaTerms },
        };

        // Fórmula vigente (la default es fija y conocida; las del usuario ya pasaron
        // por la validación de _tryCompile en sesiones previas)
        this.compiled = compileComplex(s.expr);

        this.material = new THREE.ShaderMaterial({
            glslVersion: THREE.GLSL3,
            vertexShader: VERT_TEMPLATE.replace('__EXPR__', this.compiled.glsl),
            fragmentShader: FRAG_TEMPLATE.replace('__EXPR__', this.compiled.glsl),
            uniforms: this.uniforms,
            side: THREE.DoubleSide,
        });

        // Malla estática: se sube a la GPU UNA vez; jamás se toca por frame
        this.surface = new THREE.Mesh(new THREE.PlaneGeometry(SIZE, SIZE, s.quality, s.quality), this.material);
        this.surface.rotation.x = -Math.PI / 2;
        this.scene.add(this.surface);

        // Marcador del inspector (escalado al piso grande)
        this.marker = new THREE.Mesh(
            new THREE.SphereGeometry(0.35, 20, 14),
            new THREE.MeshBasicMaterial({ color: new THREE.Color(accent.x, accent.y, accent.z) })
        );
        this.marker.visible = false;
        this.scene.add(this.marker);

        // Post-procesado: Render → UnrealBloom → Output (ACES + sRGB)
        this.composer = new EffectComposer(this.renderer);
        this.composer.setPixelRatio(this.renderer.getPixelRatio());
        this.composer.setSize(window.innerWidth, window.innerHeight);
        this.renderPass = new RenderPass(this.scene, this.camera);
        this.bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            s.bloomStrength, 0.3, 0.85   // strength, radius, threshold (solo picos/polos)
        );
        this.bloomPass.enabled = s.bloomOn;
        this.outputPass = new OutputPass();
        this.composer.addPass(this.renderPass);
        this.composer.addPass(this.bloomPass);
        this.composer.addPass(this.outputPass);

        this._onResize = () => {
            if (this.composer) this.composer.setSize(window.innerWidth, window.innerHeight);
        };
        window.addEventListener('resize', this._onResize);

        const dom = this.renderer.domElement;
        this._onPointer = (e) => {
            const r = dom.getBoundingClientRect();
            this._ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
            this._pointerDirty = true;
            this._pointerIn = true;
        };
        this._onPointerLeave = () => { this._pointerIn = false; this._hideMarker(); };
        dom.addEventListener('pointermove', this._onPointer);
        dom.addEventListener('pointerleave', this._onPointerLeave);

        this._lastTime = performance.now();
    }

    /* Hook opcional del contrato de escena: esta escena toma el control del frame
       para renderizar a través del EffectComposer (ver animate() en main.js). */
    render() {
        this.composer.render();
    }

    bindUI() {
        const s = this.state;
        const $ = (id) => document.getElementById(id);

        // ── Fórmula: debounce de 500 ms (PERFORMANCE_GUIDE §2.2) ──
        const eq = $('cp-eq');
        if (eq) {
            eq.addEventListener('input', () => {
                clearTimeout(this._compileTimer);
                this._compileTimer = setTimeout(() => this._tryCompile(eq.value), 500);
            });
            eq.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    clearTimeout(this._compileTimer);
                    this._tryCompile(eq.value);
                }
            });
        }

        const presetBtn = $('cp-preset-btn');
        const presetMenu = $('cp-preset-menu');
        const presetLabel = $('cp-preset-label');
        if (presetBtn && presetMenu) {
            presetBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                presetMenu.style.display = presetMenu.style.display === 'none' ? 'block' : 'none';
            });
            document.addEventListener('click', (e) => {
                if (!presetBtn.contains(e.target) && !presetMenu.contains(e.target)) {
                    presetMenu.style.display = 'none';
                }
            });
            document.querySelectorAll('.cp-preset-opt').forEach(opt => {
                opt.addEventListener('click', () => {
                    const v = opt.getAttribute('data-val');
                    presetLabel.textContent = opt.textContent;
                    presetMenu.style.display = 'none';
                    if (!v) return;
                    if (eq) eq.value = v;
                    clearTimeout(this._compileTimer);
                    this._tryCompile(v);
                });
                opt.addEventListener('mouseenter', () => {
                    opt.style.color = 'var(--text-primary)';
                    opt.style.background = 'rgba(var(--acc), 0.15)';
                });
                opt.addEventListener('mouseleave', () => {
                    opt.style.color = 'var(--text-secondary)';
                    opt.style.background = 'transparent';
                });
            });
        }

        const ndeg = $('cp-ndeg');
        if (ndeg) ndeg.addEventListener('input', () => {
            s.polyDeg = parseInt(ndeg.value, 10);
            const v = $('cp-ndeg-v'); if (v) v.textContent = s.polyDeg;
        });
        const poly = $('cp-poly');
        if (poly) poly.addEventListener('click', () => {
            const f = this._randomPoly(s.polyDeg);
            if (eq) eq.value = f;
            clearTimeout(this._compileTimer);
            this._tryCompile(f);
        });

        // ── ζ de Riemann ──
        const zterms = $('cp-zterms');
        if (zterms) zterms.addEventListener('input', () => {
            s.zetaTerms = parseInt(zterms.value, 10);
            this.uniforms.uZetaTerms.value = s.zetaTerms;
            const v = $('cp-zterms-v'); if (v) v.textContent = s.zetaTerms;
        });
        const crit = $('cp-critical');
        if (crit) crit.addEventListener('click', () => this._goCriticalLine());

        // ── Parámetro t ──
        const tSl = $('cp-t');
        this._tSlider = tSl;
        this._tLabel = $('cp-t-v');
        if (tSl) tSl.addEventListener('input', () => {
            s.t = parseFloat(tSl.value);
            this.uniforms.uT.value = s.t;
            if (this._tLabel) this._tLabel.textContent = s.t.toFixed(2);
        });
        const play = $('cp-play');
        if (play) play.addEventListener('click', () => {
            s.playing = !s.playing;
            play.textContent = 'Animar t ▸ ' + (s.playing ? 'ON' : 'OFF');
        });
        const speed = $('cp-speed');
        if (speed) speed.addEventListener('input', () => {
            s.speed = parseFloat(speed.value);
            const v = $('cp-speed-v'); if (v) v.textContent = s.speed.toFixed(2);
        });

        // ── Visualización (todo uniforms: cero recompilación) ──
        const h = $('cp-h');
        if (h) h.addEventListener('input', () => {
            s.heightScale = parseFloat(h.value);
            this.uniforms.uHeightScale.value = s.heightScale;
            const v = $('cp-h-v'); if (v) v.textContent = s.heightScale.toFixed(2);
        });
        const dom = $('cp-dom');
        if (dom) dom.addEventListener('input', () => {
            s.half = parseFloat(dom.value);
            this.uniforms.uHalf.value = s.half;
            const v = $('cp-dom-v'); if (v) v.textContent = '±' + s.half.toFixed(1);
        });
        const logBtn = $('cp-log');
        if (logBtn) logBtn.addEventListener('click', () => {
            s.logHeight = !s.logHeight;
            this.uniforms.uLogHeight.value = s.logHeight ? 1 : 0;
            logBtn.textContent = 'Altura log ▸ ' + (s.logHeight ? 'ON' : 'OFF');
        });
        const toggles = [
            ['cp-mod', 'showMod', 'uShowMod', '|f| ▸ '],
            ['cp-phase', 'showPhase', 'uShowPhase', 'Fase ▸ '],
            ['cp-grid', 'showGrid', 'uShowGrid', 'Grilla ▸ '],
        ];
        for (const [id, key, uni, label] of toggles) {
            const b = $(id);
            if (b) b.addEventListener('click', () => {
                s[key] = !s[key];
                this.uniforms[uni].value = s[key] ? 1 : 0;
                b.textContent = label + (s[key] ? 'ON' : 'OFF');
            });
        }

        // ── Render ──
        const q = $('cp-quality');
        if (q) q.addEventListener('change', () => {
            const N = parseInt(q.value, 10);
            if (!N || N === s.quality) return;
            s.quality = N;
            const old = this.surface.geometry;
            this.surface.geometry = new THREE.PlaneGeometry(SIZE, SIZE, N, N);
            old.dispose();   // reconstrucción puntual (no ocurre por frame)
        });
        const bloomBtn = $('cp-bloom');
        if (bloomBtn) bloomBtn.addEventListener('click', () => {
            s.bloomOn = !s.bloomOn;
            this.bloomPass.enabled = s.bloomOn;
            bloomBtn.textContent = 'Bloom ▸ ' + (s.bloomOn ? 'ON' : 'OFF');
        });
        const bstr = $('cp-bstr');
        if (bstr) bstr.addEventListener('input', () => {
            s.bloomStrength = parseFloat(bstr.value);
            this.bloomPass.strength = s.bloomStrength;
            const v = $('cp-bstr-v'); if (v) v.textContent = s.bloomStrength.toFixed(2);
        });

        this._readout = $('cp-readout');
        this._status = $('cp-status');
        this._eqInput = eq;
        this._setStatus(true, this.compiled.usesT ? 'f(z,t) compilada ✓' : 'f(z) compilada ✓ — no depende de t');
    }

    update() {
        const now = performance.now();
        const dt = Math.min((now - this._lastTime) / 1000, 0.05);
        this._lastTime = now;
        const s = this.state;

        if (s.playing) {
            s.t += s.dir * s.speed * dt;
            if (s.t > 3) { s.t = 3; s.dir = -1; }
            if (s.t < -3) { s.t = -3; s.dir = 1; }
            this.uniforms.uT.value = s.t;
            if (this._tSlider) this._tSlider.value = s.t;
            if (this._tLabel) this._tLabel.textContent = s.t.toFixed(2);
        }

        if (this._pointerDirty) {
            this._pointerDirty = false;
            this._updateInspector();
        } else if (s.playing && this.marker.visible) {
            this._updateReadout();   // t cambió: refrescar f(z) del punto inspeccionado
        }
    }

    destroy() {
        this.camera.far = this._origFar;
        this.camera.updateProjectionMatrix();

        clearTimeout(this._compileTimer);
        window.removeEventListener('resize', this._onResize);
        const dom = this.renderer.domElement;
        dom.removeEventListener('pointermove', this._onPointer);
        dom.removeEventListener('pointerleave', this._onPointerLeave);

        this.scene.remove(this.surface);
        this.scene.remove(this.marker);
        this.surface.geometry.dispose();
        this.material.dispose();
        this.marker.geometry.dispose();
        this.marker.material.dispose();
        if (this.sky) {
            this.scene.remove(this.sky);
            this.sky.geometry.dispose();
            this.sky.material.dispose();
            this.sky = null;
        }

        if (this.bloomPass && this.bloomPass.dispose) this.bloomPass.dispose();
        if (this.outputPass && this.outputPass.dispose) this.outputPass.dispose();
        if (this.composer) {
            if (this.composer.dispose) this.composer.dispose();
            else {
                this.composer.renderTarget1.dispose();
                this.composer.renderTarget2.dispose();
            }
        }
        this.composer = null;
        this.surface = null;
        this.marker = null;

        // Restaurar el estado global del renderer/escena para el resto de la suite
        this.renderer.toneMapping = this._origTone;
        this.renderer.toneMappingExposure = this._origExposure;
        this.scene.background = this._origBg;
        this.scene.fog = this._origFog;
        if (this.grid) this.grid.visible = this.gridWasVisible;
        if (this._origLimits) {
            this.controls.minPolarAngle = this._origLimits.minPolar;
            this.controls.maxPolarAngle = this._origLimits.maxPolar;
            this.controls.minDistance   = this._origLimits.minDist;
            this.controls.maxDistance   = this._origLimits.maxDist;
        }
    }

    /* ── Compilación en vivo ───────────────────────────────────────────────── */

    _tryCompile(src) {
        let c;
        try {
            c = compileComplex(src);
        } catch (err) {
            this._setStatus(false, err.message);
            return;
        }
        // Validación GLSL aislada: si falla, el shader vigente queda intacto
        // (requisito de DEVELOPER_HANDBOOK §3: nunca crashear por una fórmula)
        const glErr = this._testCompileGLSL(c.glsl);
        if (glErr) {
            console.warn('[MM-02] GLSL rechazado para «' + src + '»:\n' + c.glsl + '\n' + glErr);
            this._setStatus(false, 'La expresión no compiló en la GPU (ver consola)');
            return;
        }
        this.compiled = c;
        this.state.expr = src;
        this.material.vertexShader = VERT_TEMPLATE.replace('__EXPR__', c.glsl);
        this.material.fragmentShader = FRAG_TEMPLATE.replace('__EXPR__', c.glsl);
        this.material.needsUpdate = true;   // única recompilación permitida
        this._setStatus(true, c.usesT ? 'f(z,t) compilada ✓' : 'f(z) compilada ✓ — no depende de t');
    }

    _testCompileGLSL(expr) {
        const gl = this.renderer.getContext();
        const src = `#version 300 es
precision highp float;
uniform float uT;
${COMPLEX_GLSL}
vec2 f(vec2 z) { return ${expr}; }
out vec4 o_;
void main() { vec2 r = f(vec2(0.7, 0.3)); o_ = vec4(r, uT, 1.0); }`;
        const sh = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(sh, src);
        gl.compileShader(sh);
        const ok = gl.getShaderParameter(sh, gl.COMPILE_STATUS);
        const log = ok ? null : (gl.getShaderInfoLog(sh) || 'error GLSL desconocido');
        gl.deleteShader(sh);
        return log;
    }

    _setStatus(ok, msg) {
        if (this._status) {
            this._status.textContent = ok ? msg : '✗ ' + msg;
            this._status.style.color = ok ? '#7CFFB2' : '#ff6b6b';
        }
        if (this._eqInput) {
            this._eqInput.style.borderColor = ok ? 'var(--green-border)' : '#ff6b6b';
        }
    }

    _randomPoly(n) {
        const rnd = () => Math.round((Math.random() * 3 - 1.5) * 10) / 10;
        const terms = [];
        for (let k = n; k >= 0; k--) {
            let re = rnd(), im = rnd();
            if (k === n && re === 0 && im === 0) re = 1;
            if (re === 0 && im === 0) continue;
            const c = `(${re}${im >= 0 ? '+' : '-'}${Math.abs(im)}i)`;
            terms.push(k > 1 ? `${c}z^${k}` : (k === 1 ? `${c}z` : c));
        }
        return terms.join(' + ');
    }

    /* Encuadra ζ(z) sobre la franja crítica: carga la fórmula, abre el dominio para
       abarcar los primeros ceros no triviales (Re=1/2, Im ≈ 14.13, 21.02, 25.01,
       30.42 y sus conjugados) y orienta la cámara para verlos alineados. */
    _goCriticalLine() {
        const s = this.state;
        const $ = (id) => document.getElementById(id);

        if (this._eqInput) this._eqInput.value = 'zeta(z)';
        clearTimeout(this._compileTimer);
        this._tryCompile('zeta(z)');

        s.half = 38;                       // Im hasta ~38 → 4 ceros no triviales + conjugados
        this.uniforms.uHalf.value = s.half;
        const dom = $('cp-dom'); if (dom) dom.value = s.half;
        const domv = $('cp-dom-v'); if (domv) domv.textContent = '±' + s.half.toFixed(1);

        if (!s.showGrid) {                 // grilla ON: el eje Re=0 ubica la línea crítica (Re=1/2)
            s.showGrid = true;
            this.uniforms.uShowGrid.value = 1;
            const gb = $('cp-grid'); if (gb) gb.textContent = 'Grilla ▸ ON';
        }

        // Cámara oblicua (dentro de la banda segura) mirando el piso: la línea crítica
        // (Im variable) corre en profundidad hacia el fondo.
        this.controls.target.set(0, 0, 0);
        this.camera.position.set(0, 82, 48);
        if (this.controls.update) this.controls.update();
    }

    /* ── Inspector de cursor ───────────────────────────────────────────────── */

    _updateInspector() {
        if (!this._pointerIn) return;
        this._ray.setFromCamera(this._ndc, this.camera);
        const o = this._ray.ray.origin, d = this._ray.ray.direction;
        if (Math.abs(d.y) < 1e-8) return this._hideMarker();
        const k = -o.y / d.y;                       // intersección con el plano base y=0
        if (k <= 0) return this._hideMarker();
        const px = o.x + d.x * k, pz = o.z + d.z * k;
        const half = SIZE / 2;
        if (Math.abs(px) > half || Math.abs(pz) > half) return this._hideMarker();

        this._inspectWorld[0] = px;
        this._inspectWorld[1] = pz;
        this._inspectZ[0] = (px / half) * this.state.half;
        this._inspectZ[1] = (-pz / half) * this.state.half;
        this._updateReadout();
    }

    _updateReadout() {
        const s = this.state;
        const [zr, zi] = this._inspectZ;
        let w;
        try { w = this.compiled.evaluate(zr, zi, s.t); } catch (e) { return this._hideMarker(); }
        const R = Math.hypot(w[0], w[1]);
        const finite = isFinite(R);
        // Misma fórmula que el vertex shader (ver HEIGHT_EXPR): altura congelada a ±6
        const worldPerZ = SIZE / (2 * Math.max(s.half, 6));
        const hCap = worldPerZ * CAP_Z;
        const raw = s.logHeight ? Math.log(1 + R) : R;
        let hgt = finite ? worldPerZ * s.heightScale * raw : hCap;
        if (!(hgt <= hCap)) hgt = hCap;

        this.marker.visible = true;
        this.marker.position.set(this._inspectWorld[0], hgt, this._inspectWorld[1]);

        if (this._readout) {
            const fm = (x) => (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(3);
            this._readout.innerHTML = finite
                ? `z&nbsp;&nbsp;&nbsp;= ${fm(zr)} ${zi >= 0 ? '+' : '−'} ${Math.abs(zi).toFixed(3)}i<br>` +
                  `f(z) = ${fm(w[0])} ${w[1] >= 0 ? '+' : '−'} ${Math.abs(w[1]).toFixed(3)}i<br>` +
                  `|f| = ${R.toFixed(3)} &nbsp;·&nbsp; arg f = ${Math.atan2(w[1], w[0]).toFixed(3)} rad`
                : `z = ${fm(zr)} ${zi >= 0 ? '+' : '−'} ${Math.abs(zi).toFixed(3)}i<br>f(z) → ∞ &nbsp;(polo)`;
        }
    }

    _hideMarker() {
        if (this.marker) this.marker.visible = false;
        if (this._readout) this._readout.textContent = '— mové el cursor sobre la superficie —';
    }
}

return ComplexPlaneScene;

})();

/* ═════════════════════════════════════════════════════════════════════════════
   ARNÉS — réplica reducida de helmholtz-sim/main.js (no editar por módulo)
   Contrato de escena: new SceneClass(scene, camera, controls, renderer)
   → infoHTML, controlsHTML, init(), bindUI?(), update?(), render?(), destroy()
   ═════════════════════════════════════════════════════════════════════════════ */
const infoBody     = document.getElementById('info-body');
const controlsBody = document.getElementById('controls-body');

window.renderMath = function () {
    const opts = {
        delimiters: [
            { left: '$$', right: '$$', display: true  },
            { left: '$',  right: '$',  display: false },
        ],
        strict: (code) => (code === 'newLineInDisplayMode' ? 'ignore' : 'warn'),
    };
    if (window.renderMathInElement) {
        window.renderMathInElement(infoBody,     opts);
        window.renderMathInElement(controlsBody, opts);
    }
};

function showError(msg) {
    const el = document.getElementById('pl-error');
    el.textContent = msg;
    el.style.display = 'block';
}

const container = document.getElementById('canvas-container');
const scene     = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x040d08, 0.045);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(10, 8, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x040d08, 1);
container.appendChild(renderer.domElement);

// Resolución adaptativa (un solo sentido: baja si el frame pasa de ~21 ms)
const DPR_MAX = Math.min(window.devicePixelRatio || 1, 1.75);
const DPR_MIN = 0.7;
let dpr = DPR_MAX;
function applyResolution() {
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
}
applyResolution();
const QUAL = { frames: 0, acc: 0, warmup: 0, WINDOW: 60, WARMUP: 90 };
function sampleFrame(dt) {
    if (dt <= 0 || dt > 500) return;
    if (QUAL.warmup < QUAL.WARMUP) { QUAL.warmup++; return; }
    QUAL.acc += dt;
    if (++QUAL.frames < QUAL.WINDOW) return;
    const avg = QUAL.acc / QUAL.frames;
    QUAL.frames = 0; QUAL.acc = 0;
    if (avg > 21 && dpr > DPR_MIN) { dpr = Math.max(DPR_MIN, dpr - 0.15); applyResolution(); }
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.AmbientLight(0x00ff88, 0.3));
const dirLight = new THREE.DirectionalLight(0x00ff88, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x004422, 0.5);
fillLight.position.set(-10, -5, -10);
scene.add(fillLight);
const gridHelper = new THREE.GridHelper(120, 120, 0x003322, 0x001a11);
gridHelper.position.y = -5;
scene.add(gridHelper);

// Paneles contraíbles (de ui_chrome.js)
(function () {
    const infoP = document.getElementById('info-container');
    const ctrlP = document.getElementById('controls-container');
    const tabL  = document.getElementById('reveal-left');
    const tabR  = document.getElementById('reveal-right');
    function setCollapsed(panel, tab, collapsed) {
        panel.classList.toggle('collapsed', collapsed);
        tab.classList.toggle('show', collapsed);
    }
    document.querySelectorAll('.panel-collapse').forEach((btn) => {
        btn.addEventListener('click', () => {
            if (btn.getAttribute('data-side') === 'left') setCollapsed(infoP, tabL, true);
            else setCollapsed(ctrlP, tabR, true);
        });
    });
    tabL.addEventListener('click', () => setCollapsed(infoP, tabL, false));
    tabR.addEventListener('click', () => setCollapsed(ctrlP, tabR, false));
})();

let currentScene = null;
try {
    currentScene = new SceneClass(scene, camera, controls, renderer);
    window.__plScene = currentScene;
    infoBody.innerHTML     = currentScene.infoHTML     || '';
    controlsBody.innerHTML = currentScene.controlsHTML || '';
    currentScene.init();
    if (currentScene.bindUI) currentScene.bindUI();
    try {
        renderer.compile(scene, camera);
        if (currentScene.render) currentScene.render();
        else renderer.render(scene, camera);
    } catch (err) {
        console.warn('[PhysicsLab] Pre-compilación de shaders falló:', err);
    }
    window.renderMath();
    // KaTeX llega por CDN con defer: si aún no estaba, re-renderizar al cargar todo.
    if (!window.renderMathInElement) window.addEventListener('load', () => window.renderMath());
} catch (err) {
    console.error('[PhysicsLab] Error iniciando el módulo:', err);
    showError('No se pudo iniciar la simulación.\n\n' + (err && err.message ? err.message : err) +
        '\n\n¿Hay conexión a internet? three.js y KaTeX se cargan desde CDN.');
    currentScene = null;
}

let resizeTimer = 0;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        applyResolution();
    }, 120);
});

let prev = 0, updateErrLogged = false, renderErrLogged = false;
function animate(now) {
    requestAnimationFrame(animate);
    if (prev) sampleFrame(now - prev);
    prev = now;
    controls.update();
    try {
        if (currentScene && currentScene.update) currentScene.update();
    } catch (err) {
        if (!updateErrLogged) { updateErrLogged = true; console.error('[PhysicsLab] Error en update():', err); }
    }
    try {
        if (currentScene && currentScene.render) currentScene.render();
        else renderer.render(scene, camera);
    } catch (err) {
        if (!renderErrLogged) { renderErrLogged = true; console.error('[PhysicsLab] Error en render():', err); }
    }
}
requestAnimationFrame(animate);
</script>
