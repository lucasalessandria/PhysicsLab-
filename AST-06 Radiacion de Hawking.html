/* ═════════════════════════════════════════════════════════════════════════════
   ARNÉS — réplica reducida de helmholtz-sim/main.js (no editar por módulo)
   Contrato de escena: new SceneClass(scene, camera, controls, renderer)
   → infoHTML, controlsHTML, init(), bindUI?(), update?(), render?(), destroy()
   ═════════════════════════════════════════════════════════════════════════════ */
const infoBody     = document.getElementById('info-body');
const controlsBody = document.getElementById('controls-body');

window.renderMath = function () {
    const opts = {
        delimiters: [
            { left: '$$', right: '$$', display: true  },
            { left: '$',  right: '$',  display: false },
        ],
        strict: (code) => (code === 'newLineInDisplayMode' ? 'ignore' : 'warn'),
    };
    if (window.renderMathInElement) {
        window.renderMathInElement(infoBody,     opts);
        window.renderMathInElement(controlsBody, opts);
    }
};

function showError(msg) {
    const el = document.getElementById('pl-error');
    el.textContent = msg;
    el.style.display = 'block';
}

const container = document.getElementById('canvas-container');
const scene     = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x040d08, 0.045);

const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(10, 8, 15);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
renderer.setClearColor(0x040d08, 1);
container.appendChild(renderer.domElement);

// Resolución adaptativa (un solo sentido: baja si el frame pasa de ~21 ms)
const DPR_MAX = Math.min(window.devicePixelRatio || 1, 1.75);
const DPR_MIN = 0.7;
let dpr = DPR_MAX;
function applyResolution() {
    renderer.setPixelRatio(dpr);
    renderer.setSize(window.innerWidth, window.innerHeight);
}
applyResolution();
const QUAL = { frames: 0, acc: 0, warmup: 0, WINDOW: 60, WARMUP: 90 };
function sampleFrame(dt) {
    if (dt <= 0 || dt > 500) return;
    if (QUAL.warmup < QUAL.WARMUP) { QUAL.warmup++; return; }
    QUAL.acc += dt;
    if (++QUAL.frames < QUAL.WINDOW) return;
    const avg = QUAL.acc / QUAL.frames;
    QUAL.frames = 0; QUAL.acc = 0;
    if (avg > 21 && dpr > DPR_MIN) { dpr = Math.max(DPR_MIN, dpr - 0.15); applyResolution(); }
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping   = true;
controls.autoRotate      = true;
controls.autoRotateSpeed = 0.4;

scene.add(new THREE.AmbientLight(0x00ff88, 0.3));
const dirLight = new THREE.DirectionalLight(0x00ff88, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
const fillLight = new THREE.DirectionalLight(0x004422, 0.5);
fillLight.position.set(-10, -5, -10);
scene.add(fillLight);
const gridHelper = new THREE.GridHelper(120, 120, 0x003322, 0x001a11);
gridHelper.position.y = -5;
scene.add(gridHelper);

// Paneles contraíbles (de ui_chrome.js)
(function () {
    const infoP = document.getElementById('info-container');
    const ctrlP = document.getElementById('controls-container');
    const tabL  = document.getElementById('reveal-left');
    const tabR  = document.getElementById('reveal-right');
    function setCollapsed(panel, tab, collapsed) {
        panel.classList.toggle('collapsed', collapsed);
        tab.classList.toggle('show', collapsed);
    }
    document.querySelectorAll('.panel-collapse').forEach((btn) => {
        btn.addEventListener('click', () => {
            if (btn.getAttribute('data-side') === 'left') setCollapsed(infoP, tabL, true);
            else setCollapsed(ctrlP, tabR, true);
        });
    });
    tabL.addEventListener('click', () => setCollapsed(infoP, tabL, false));
    tabR.addEventListener('click', () => setCollapsed(ctrlP, tabR, false));
})();

let currentScene = null;
try {
    currentScene = new SceneClass(scene, camera, controls, renderer);
    window.__plScene = currentScene;
    infoBody.innerHTML     = currentScene.infoHTML     || '';
    controlsBody.innerHTML = currentScene.controlsHTML || '';
    currentScene.init();
    if (currentScene.bindUI) currentScene.bindUI();
    try {
        renderer.compile(scene, camera);
        if (currentScene.render) currentScene.render();
        else renderer.render(scene, camera);
    } catch (err) {
        console.warn('[PhysicsLab] Pre-compilación de shaders falló:', err);
    }
    window.renderMath();
    // KaTeX llega por CDN con defer: si aún no estaba, re-renderizar al cargar todo.
    if (!window.renderMathInElement) window.addEventListener('load', () => window.renderMath());
} catch (err) {
    console.error('[PhysicsLab] Error iniciando el módulo:', err);
    showError('No se pudo iniciar la simulación.\n\n' + (err && err.message ? err.message : err) +
        '\n\n¿Hay conexión a internet? three.js y KaTeX se cargan desde CDN.');
    currentScene = null;
}

let resizeTimer = 0;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        applyResolution();
    }, 120);
});

let prev = 0, updateErrLogged = false, renderErrLogged = false;
function animate(now) {
    requestAnimationFrame(animate);
    if (prev) sampleFrame(now - prev);
    prev = now;
    controls.update();
    try {
        if (currentScene && currentScene.update) currentScene.update();
    } catch (err) {
        if (!updateErrLogged) { updateErrLogged = true; console.error('[PhysicsLab] Error en update():', err); }
    }
    try {
        if (currentScene && currentScene.render) currentScene.render();
        else renderer.render(scene, camera);
    } catch (err) {
        if (!renderErrLogged) { renderErrLogged = true; console.error('[PhysicsLab] Error en render():', err); }
    }
}
requestAnimationFrame(animate);
</script>
